<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesion - Gestion de Incidencias</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="contenedor-login">
    <h1>Sistema de Gestion de Incidencias</h1>
    <p class="subtitulo">Inicia sesion para continuar</p>

    <div class="mensaje-error" id="mensajeError"></div>

    <form id="formLogin">
      <label for="email">Correo electronico</label>
      <input type="email" id="email" required>

      <label for="password">Contrasena</label>
      <input type="password" id="password" required>

      <button type="submit" class="btn-primario">Iniciar sesion</button>
    </form>

    <div class="credenciales-demo">
      <strong>Cuentas de prueba</strong><br>
      Admin: admin@incidencias.com / Admin123!<br>
      Usuario: usuario@incidencias.com / Usuario123!
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
