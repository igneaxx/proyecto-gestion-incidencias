<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diagrama de arquitectura</title>
<style>
  body { margin:0; background:#ffffff; font-family:'Segoe UI', Arial, sans-serif; }
  #lienzo { width:1200px; height:640px; }
</style>
</head>
<body>
<svg id="lienzo" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    Arquitectura - Sistema Web de Gestion de Incidencias
  </text>

  <!-- Usuario -->
  <rect x="40" y="260" width="160" height="90" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="120" y="298" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">Usuario /</text>
  <text x="120" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">Navegador</text>

  <!-- Frontend -->
  <rect x="290" y="260" width="180" height="90" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="380" y="298" text-anchor="middle" font-size="15" font-weight="600" fill="#083344">Frontend</text>
  <text x="380" y="318" text-anchor="middle" font-size="12" fill="#155e75">HTML / CSS / JS</text>

  <!-- Backend -->
  <rect x="560" y="260" width="200" height="90" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="660" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#422006">API / Backend</text>
  <text x="660" y="312" text-anchor="middle" font-size="12" fill="#713f12">Node.js + Express</text>
  <text x="660" y="330" text-anchor="middle" font-size="11" fill="#713f12">JWT · bcrypt · validaciones</text>

  <!-- Base de datos -->
  <rect x="860" y="260" width="180" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="950" y="298" text-anchor="middle" font-size="15" font-weight="600" fill="#052e16">Base de Datos</text>
  <text x="950" y="318" text-anchor="middle" font-size="12" fill="#166534">Usuarios / Incidencias</text>

  <!-- API externa -->
  <rect x="560" y="440" width="200" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="660" y="472" text-anchor="middle" font-size="15" font-weight="600" fill="#450a0a">API Externa</text>
  <text x="660" y="492" text-anchor="middle" font-size="12" fill="#7f1d1d">Geolocalizacion por IP</text>
  <text x="660" y="510" text-anchor="middle" font-size="11" fill="#7f1d1d">(ipwho.is)</text>

  <!-- Flechas -->
  <line x1="200" y1="290" x2="288" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="244" y="278" text-anchor="middle" font-size="11" fill="#374151">HTTPS</text>

  <line x1="288" y1="320" x2="200" y2="320" stroke="#9ca3af" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="244" y="336" text-anchor="middle" font-size="11" fill="#6b7280">HTML/JSON</text>

  <line x1="470" y1="290" x2="558" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="514" y="278" text-anchor="middle" font-size="11" fill="#374151">fetch() + JWT</text>

  <line x1="558" y1="320" x2="470" y2="320" stroke="#9ca3af" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="514" y="336" text-anchor="middle" font-size="11" fill="#6b7280">JSON</text>

  <line x1="760" y1="290" x2="858" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="810" y="278" text-anchor="middle" font-size="11" fill="#374151">consultas</text>

  <line x1="858" y1="320" x2="760" y2="320" stroke="#9ca3af" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="810" y="336" text-anchor="middle" font-size="11" fill="#6b7280">datos</text>

  <line x1="660" y1="350" x2="660" y2="438" stroke="#374151" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="600" y="400" text-anchor="middle" font-size="11" fill="#374151">HTTPS GET</text>

  <line x1="675" y1="438" x2="675" y2="352" stroke="#9ca3af" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="740" y="400" text-anchor="middle" font-size="11" fill="#6b7280">ciudad/pais</text>

  <!-- Leyenda -->
  <text x="40" y="600" font-size="12" fill="#374151">Flujo: el navegador solicita paginas al Frontend; el Frontend consume la API REST del Backend usando JSON y token JWT;</text>
  <text x="40" y="620" font-size="12" fill="#374151">el Backend valida, autentica y persiste en la Base de Datos, y consulta una API externa para enriquecer cada incidencia con su ubicacion.</text>
</svg>
</body>
</html>
